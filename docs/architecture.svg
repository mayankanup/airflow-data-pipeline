<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="oltp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="olap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="airflow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="meta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="metabase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1180" height="780" fill="url(#bg)"/>
  <text x="590" y="48" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle">Daily Sales Report — Architecture</text>
  <text x="590" y="76" fill="#94a3b8" font-size="15" text-anchor="middle">Postgres OLTP → Airflow batch ELT → Postgres OLAP → Metabase BI  ·  Docker Compose</text>

  <!-- OLTP -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="270" height="230" rx="16" fill="url(#oltp)"/>
  </g>
  <text x="82" y="168" fill="#ffffff" font-size="19" font-weight="700">OLTP  ·  Source</text>
  <text x="82" y="192" fill="#d1fae5" font-size="13">oltp-postgres  ·  postgres:16</text>
  <line x1="82" y1="206" x2="308" y2="206" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="82" y="234" fill="#ecfdf5" font-family="Consolas, monospace" font-size="13.5">db: oltp</text>
  <text x="82" y="258" fill="#ecfdf5" font-family="Consolas, monospace" font-size="13.5">orders(</text>
  <text x="98" y="280" fill="#ecfdf5" font-family="Consolas, monospace" font-size="13.5">id, order_date,</text>
  <text x="98" y="302" fill="#ecfdf5" font-family="Consolas, monospace" font-size="13.5">amount, status)</text>
  <text x="82" y="338" fill="#a7f3d0" font-size="12.5">host :5433  ·  container :5432</text>

  <!-- OLAP -->
  <g filter="url(#shadow)">
    <rect x="850" y="130" width="270" height="230" rx="16" fill="url(#olap)"/>
  </g>
  <text x="872" y="168" fill="#ffffff" font-size="19" font-weight="700">OLAP  ·  Reporting</text>
  <text x="872" y="192" fill="#dbeafe" font-size="13">olap-postgres  ·  postgres:16</text>
  <line x1="872" y1="206" x2="1098" y2="206" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="872" y="234" fill="#eff6ff" font-family="Consolas, monospace" font-size="13.5">db: olap</text>
  <text x="872" y="258" fill="#eff6ff" font-family="Consolas, monospace" font-size="13.5">daily_sales_summary(</text>
  <text x="888" y="280" fill="#eff6ff" font-family="Consolas, monospace" font-size="13.5">date PK,</text>
  <text x="888" y="302" fill="#eff6ff" font-family="Consolas, monospace" font-size="13.5">total_revenue,</text>
  <text x="888" y="324" fill="#eff6ff" font-family="Consolas, monospace" font-size="13.5">order_count)</text>
  <text x="872" y="350" fill="#bfdbfe" font-size="12.5">host :5434  ·  container :5432</text>

  <!-- Airflow container outer -->
  <g filter="url(#shadow)">
    <rect x="390" y="120" width="400" height="330" rx="18" fill="#0b1220" stroke="url(#airflow)" stroke-width="2.5"/>
  </g>
  <rect x="390" y="120" width="400" height="52" rx="18" fill="url(#airflow)"/>
  <rect x="390" y="150" width="400" height="22" fill="url(#airflow)"/>
  <text x="590" y="154" fill="#1f2937" font-size="19" font-weight="800" text-anchor="middle">AIRFLOW 2.9.1  ·  LocalExecutor</text>

  <!-- scheduler -->
  <rect x="414" y="194" width="352" height="150" rx="12" fill="#111c2e" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="432" y="220" fill="#fbbf24" font-size="15" font-weight="700">airflow-scheduler</text>
  <text x="432" y="244" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">DAG: daily_sales_report</text>
  <text x="432" y="266" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">schedule: @daily</text>
  <rect x="432" y="284" width="96" height="40" rx="9" fill="#065f46"/>
  <text x="480" y="309" fill="#d1fae5" font-size="14" font-weight="700" text-anchor="middle">extract</text>
  <path d="M534 304 L574 304" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="580" y="284" width="88" height="40" rx="9" fill="#1e3a8a"/>
  <text x="624" y="309" fill="#dbeafe" font-size="14" font-weight="700" text-anchor="middle">load</text>
  <text x="432" y="338" fill="#94a3b8" font-size="11.5">oltp_default  →  olap_default  (idempotent upsert)</text>

  <!-- webserver -->
  <rect x="414" y="360" width="170" height="76" rx="12" fill="#111c2e" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="430" y="386" fill="#fbbf24" font-size="14" font-weight="700">airflow-webserver</text>
  <text x="430" y="408" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12.5">UI  :8080</text>
  <text x="430" y="426" fill="#94a3b8" font-size="11.5">admin / admin</text>

  <!-- meta db -->
  <rect x="596" y="360" width="170" height="76" rx="12" fill="#111c2e" stroke="#64748b"/>
  <text x="612" y="386" fill="#cbd5e1" font-size="14" font-weight="700">postgres-meta</text>
  <text x="612" y="408" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12.5">airflow-meta</text>
  <text x="612" y="426" fill="#94a3b8" font-size="11.5">runs / tasks state</text>

  <!-- airflow -> oltp (extract) -->
  <path d="M390 262 C 340 262, 336 250, 330 250" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="356" y="228" fill="#34d399" font-size="12" text-anchor="middle">SELECT</text>
  <text x="356" y="243" fill="#34d399" font-size="12" text-anchor="middle">status=completed</text>

  <!-- airflow -> olap (load) -->
  <path d="M790 300 C 838 300, 820 300, 850 300" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="822" y="282" fill="#60a5fa" font-size="12" text-anchor="middle">upsert</text>
  <text x="822" y="297" fill="#60a5fa" font-size="12" text-anchor="middle">ON CONFLICT</text>

  <!-- bind mounts -->
  <text x="590" y="472" fill="#64748b" font-size="12" text-anchor="middle">bind mounts:  ./dags   ./logs   ./plugins</text>

  <!-- Metabase -->
  <g filter="url(#shadow)">
    <rect x="470" y="560" width="430" height="120" rx="16" fill="url(#metabase)"/>
  </g>
  <text x="494" y="600" fill="#ffffff" font-size="18" font-weight="700">METABASE  ·  BI  :3000</text>
  <text x="494" y="626" fill="#fce7f3" font-size="13">Saved question  "Daily Revenue"   →   /question/40</text>
  <text x="494" y="650" fill="#fce7f3" font-size="12.5" font-family="Consolas, monospace">reads olap  ·  RO user metabase_reader</text>

  <!-- olap -> metabase -->
  <path d="M960 360 C 960 500, 780 500, 740 560" stroke="#f9a8d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="860" y="455" fill="#f9a8d4" font-size="12">query daily_sales_summary</text>

  <!-- report / audit footer -->
  <rect x="60" y="560" width="340" height="120" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="80" y="596" fill="#38bdf8" font-size="16" font-weight="700">Report &amp; Audit (SQL)</text>
  <text x="80" y="622" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">sql/daily_sales_report.sql   (OLAP)</text>
  <text x="80" y="644" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">sql/validate_report.sql       (OLTP)</text>
  <text x="80" y="666" fill="#94a3b8" font-size="11.5">oracle: 15/15 rows MATCH  ·  2026-10-15 = 6160.27 / 22</text>
</svg>
